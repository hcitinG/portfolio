<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Portfolio Admin</title>

  <link href="../assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet" />
  <link href="admin.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.snow.css" rel="stylesheet" />
</head>

<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <span class="navbar-brand">Portfolio Admin</span>

      <div class="d-flex gap-2 align-items-center">
        <span id="saveState" class="text-white-50 small me-2"></span>
        <button id="btnSave" class="btn btn-success btn-sm" disabled>儲存變更</button>
        <button id="btnImport" class="btn btn-outline-light btn-sm">匯入 content.json</button>
        <button id="btnExport" class="btn btn-warning btn-sm">匯出 content.json</button>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <div class="alert alert-secondary small">
      這是純前端後台：修改後請「匯出 content.json」，覆蓋到
      <code>assets/data/content.json</code>，再推到 GitHub。
    </div>

    <div class="row g-3">
      <!-- LEFT -->
      <div class="col-12 col-lg-6">
        <div class="card">
          <div class="card-header">Hero</div>
          <div class="card-body">
            <div class="mb-2">
              <label class="form-label">headlinePrefix</label>
              <input id="heroPrefix" class="form-control" />
            </div>
            <div class="mb-2">
              <label class="form-label">typedItems（用逗號分隔）</label>
              <input id="heroTyped" class="form-control" />
            </div>
            <div class="mb-2">
              <label class="form-label">subline</label>
              <input id="heroSubline" class="form-control" />
            </div>
          </div>
        </div>

        <div class="card mt-3">
          <div class="card-header">About</div>
          <div class="card-body">
            <div class="mb-2">
              <label class="form-label">lead</label>
              <div id="aboutLead" class="quill-editor"></div>
            </div>
            <div class="mb-2">
              <label class="form-label">body</label>
              <div id="aboutBody" class="quill-editor"></div>
            </div>
            <div class="mb-2">
              <label class="form-label">image</label>
              <input id="aboutImage" class="form-control" />
            </div>
          </div>
        </div>

        <div class="card mt-3">
          <div class="card-header d-flex justify-content-between">
            <span>Filters</span>
            <button id="btnAddFilter" class="btn btn-sm btn-primary">新增</button>
          </div>
          <div class="card-body">
            <div id="filtersList" class="vstack gap-2"></div>
          </div>
        </div>
      </div>

      <!-- RIGHT -->
      <div class="col-12 col-lg-6">
        <div class="card">
          <div class="card-header d-flex justify-content-between">
            <span>Portfolio Items</span>
            <button id="btnAddItem" class="btn btn-sm btn-primary">新增作品</button>
          </div>

          <div class="card-body">
            <div class="admin-split">
              <!-- LIST -->
              <div class="admin-list">
                <div class="d-flex gap-2 mb-2">
                  <input id="itemSearch" class="form-control form-control-sm" placeholder="搜尋 title / id" />
                  <select id="itemFilter" class="form-select form-select-sm" style="max-width:160px">
                    <option value="*">全部</option>
                  </select>
                </div>
                <div id="itemsList" class="vstack gap-2"></div>
                <div class="form-text mt-2">
                  拖曳左側把手可更動前台顯示順序
                </div>
              </div>

              <!-- EDITOR -->
              <div class="admin-editor">
                <div id="itemEditorEmpty" class="text-muted small">
                  請先從左側選擇一個作品
                </div>

                <div id="itemEditor" class="d-none">
                  <div class="d-flex justify-content-between align-items-start">
                    <div>
                      <div class="small text-muted">編輯中</div>
                      <div id="editingTitle" class="fw-semibold"></div>
                    </div>
                    <button id="btnDeleteItem" class="btn btn-sm btn-outline-danger">刪除</button>
                  </div>

                  <hr />

                  <div class="kv">
                    <div class="small-muted">id</div>
                    <input id="ed_id" class="form-control form-control-sm" />
                    <div class="small-muted">title</div>
                    <input id="ed_title" class="form-control form-control-sm" />
                    <div class="small-muted">subtitle</div>
                    <input id="ed_subtitle" class="form-control form-control-sm" />

                    <div class="small-muted">thumb</div>
                    <div>
                      <input id="ed_thumb" class="form-control form-control-sm" />
                      <div class="thumbRow mt-2">
                        <img id="pv_thumb" class="thumb" />
                        <div class="thumbMeta small text-muted">縮圖預覽</div>
                      </div>
                    </div>

                    <div class="small-muted">projectUrl</div>
                    <input id="ed_projectUrl" class="form-control form-control-sm" />

                    <div class="small-muted">description</div>
                    <textarea id="ed_desc" class="form-control form-control-sm" rows="4"></textarea>
                  </div>

                  <div class="mt-3">
                    <div class="small-muted mb-1">filters</div>
                    <div id="ed_filters" class="d-flex flex-wrap gap-2"></div>
                  </div>

                  <div class="mt-3">
                    <div class="small-muted mb-1">detail images</div>
                    <div class="vstack gap-2">
                      <input id="ed_img0" class="form-control form-control-sm" placeholder="image 1" />
                      <img id="pv_img0" class="thumb" />
                      <input id="ed_img1" class="form-control form-control-sm" placeholder="image 2" />
                      <img id="pv_img1" class="thumb" />
                      <input id="ed_img2" class="form-control form-control-sm" placeholder="image 3" />
                      <img id="pv_img2" class="thumb" />
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <input id="fileInput" type="file" accept="application/json" hidden />
  </main>

  <script src="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
  <script src="../assets/js/placeholders.js"></script>
  <script src="admin.js"></script>
</body>
</html>
